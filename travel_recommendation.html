<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Explorer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background-color: #111;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            width: 100%;
            min-height: 75px;
            background-color: #12343b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 40px;
            position: relative;
            z-index: 10;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            font-size: 30px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #22c7b8;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-container {
            background-color: white;
            border-radius: 30px;
            padding: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .search-container input {
            width: 250px;
            padding: 11px 15px;
            border: none;
            outline: none;
            border-radius: 30px;
            font-size: 14px;
        }

        .search-container button {
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            background-color: #0d9488;
            color: white;
            font-weight: bold;
        }

        .search-container button:hover {
            background-color: #0f766e;
        }

        /* =========================
           HERO SECTION
        ========================= */

        .hero {
            min-height: calc(100vh - 75px);

            background:
                linear-gradient(
                    rgba(0, 40, 50, 0.65),
                    rgba(0, 40, 50, 0.55)
                ),
                url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: grid;
            grid-template-columns: 70px 1fr;
            position: relative;
        }

        /* =========================
           SOCIAL MEDIA
        ========================= */

        .social-media {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            background-color: rgba(0, 0, 0, 0.15);
        }

        .social-media a {
            color: white;
            font-size: 24px;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-media a:hover {
            transform: scale(1.2);
            color: #2dd4bf;
        }

        /* =========================
           HERO CONTENT
        ========================= */

        .hero-content {
            padding: 100px 60px;
            max-width: 700px;
        }

        .hero-content h1 {
            font-size: 65px;
            line-height: 1.05;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .hero-content p {
            max-width: 550px;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #eeeeee;
        }

        .book-button {
            background-color: #0d9488;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .book-button:hover {
            background-color: #0f766e;
        }

        /* =========================
           SEARCH RESULTS
        ========================= */

        #recommendationResults {
            position: absolute;

            top: 40px;
            right: 40px;

            width: 48%;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;

            max-height: calc(100vh - 130px);
            overflow-y: auto;

            padding: 10px;
        }

        .recommendation-card {
            background-color: white;
            color: #222;
            border-radius: 10px;
            overflow: hidden;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.25);
        }

        .recommendation-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .recommendation-content {
            padding: 18px;
        }

        .recommendation-content h2 {
            font-size: 21px;
            color: #12343b;
            margin-bottom: 10px;
        }

        .recommendation-content p {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 14px;
        }

        .visit-button {
            padding: 9px 18px;
            background-color: #0d9488;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        .no-results {
            grid-column: 1 / -1;
            background-color: white;
            color: #333;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {

            nav {
                flex-wrap: wrap;
                gap: 15px;
            }

            #recommendationResults {
                position: relative;
                top: auto;
                right: auto;
                width: 100%;
                grid-column: 1 / -1;
                padding: 30px;
            }

            .hero {
                grid-template-columns: 60px 1fr;
            }
        }

        @media (max-width: 768px) {

            nav {
                padding: 15px;
            }

            .nav-links {
                gap: 12px;
            }

            .search-container {
                width: 100%;
            }

            .search-container input {
                flex: 1;
                width: auto;
            }

            .hero-content {
                padding: 70px 25px;
            }

            .hero-content h1 {
                font-size: 45px;
            }

            #recommendationResults {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVIGATION BAR
    ========================== -->

    <nav>

        <div class="brand">
            <span class="brand-logo">✈</span>
            <span>Travel Explorer</span>
        </div>

        <div class="nav-links">

            <a href="travel_recommendation.html">
                Home
            </a>

            <a href="about_us.html">
                About Us
            </a>

            <a href="contact_us.html">
                Contact Us
            </a>

        </div>

        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Enter a destination or keyword"
            >

            <button id="searchButton">
                Search
            </button>

            <button id="resetButton">
                Clear
            </button>

        </div>

    </nav>

    <!-- =========================
         HOME PAGE
    ========================== -->

    <main class="hero">

        <!-- Social Media Links -->

        <div class="social-media">

            <a href="#" aria-label="Facebook">
                f
            </a>

            <a href="#" aria-label="Twitter">
                𝕏
            </a>

            <a href="#" aria-label="Instagram">
                ◎
            </a>

            <a href="#" aria-label="YouTube">
                ▶
            </a>

        </div>

        <!-- Website Introduction -->

        <section class="hero-content">

            <h1>
                Explore<br>
                Dream<br>
                Destination
            </h1>

            <p>
                Discover breathtaking destinations, experience diverse
                cultures, explore beautiful beaches, visit historic temples,
                and find unforgettable places around the world.
                Travel Explorer helps you discover your next adventure.
            </p>

            <button class="book-button">
                BOOK NOW
            </button>

        </section>

        <!-- Dynamic recommendation results -->

        <section id="recommendationResults"></section>

    </main>


    <script src="travel_recommendation.js"></script>

</body>
</html>
